<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luhnアルゴリズム - 学習と検証</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <!-- メインコンテンツ -->
  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- タイトル -->
    <header class="mb-12">
      <h1 class="text-4xl font-bold text-center mb-4">Luhnアルゴリズム</h1>
      <p class="text-center text-gray-600">学習と検証のための教育的Webアプリケーション</p>
    </header>

    <!-- 解説セクション用プレースホルダー -->
    <section id="explanation" class="mb-16">
      <h2 class="text-2xl font-semibold mb-4">Luhnアルゴリズムとは？</h2>
      <p class="text-gray-700 leading-relaxed mb-4">
        解説コンテンツはタスク4で実装します。
      </p>
    </section>

    <!-- 計算手順セクション用プレースホルダー -->
    <section id="steps" class="mb-16">
      <h2 class="text-2xl font-semibold mb-4">計算手順</h2>
      <p class="text-gray-700">
        計算手順の詳細はタスク4で実装します。
      </p>
    </section>

    <!-- スペーサー (固定フォームが解説を隠さないための余白) -->
    <div class="h-32 md:h-0"></div>
  </main>

  <!-- 固定配置の検証フォーム -->
  <aside id="validator-form" class="fixed bottom-0 left-0 right-0 md:bottom-auto md:top-4 md:right-4 md:left-auto md:w-96 bg-white shadow-lg p-6 rounded-t-lg md:rounded-lg border-t md:border z-50">
    <h3 class="text-lg font-semibold mb-4">数値を検証</h3>

    <div class="mb-4">
      <label for="number-input" class="block text-sm font-medium text-gray-700 mb-2">
        検証対象の数値を入力
      </label>
      <input
        type="text"
        id="number-input"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="例: 4532015112830366"
        aria-label="検証対象の数値"
      >
    </div>

    <div id="result" class="p-3 rounded-md bg-gray-100 text-gray-600 text-sm" role="status" aria-live="polite">
      数値を入力してください
    </div>
  </aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
